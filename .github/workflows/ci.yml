name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint
        run: pnpm lint

      - name: Repository and installer guards
        run: |
          pnpm --filter server test:sample-seed-safety
          pnpm --filter server type-check:sample-seed
          node scripts/test-repository-source-guards.mjs
          pnpm --filter server test:host-install-inputs
          bash scripts/test-install-panel-guards.sh
          python3 scripts/test-onboarding-control.py
          python3 scripts/test-onboarding-gateway.py
          sudo python3 -B scripts/test-host-gateway-dns.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iproute2
          sudo env INCUDAL_NETWORK_NAMESPACE_TEST=1 unshare --net python3 scripts/test-onboarding-control-network.py

      - name: Type check (client)
        run: pnpm --filter client type-check

      - name: Type check (server)
        run: pnpm --filter server type-check

      - name: Controller candidate and discovery guards
        run: pnpm --filter server test:controller-config-guards

      - name: Management gateway task guards
        run: |
          pnpm --filter server test:gateway-task-guards
          pnpm --filter server test:gateway-management-route-guards
          node scripts/run-tests.mjs --only simple-gateway-setup
          python3 scripts/test-management-gateway-preflight.py
          sudo python3 scripts/test-gateway-component-package.py
          sudo python3 scripts/test-gateway-install-plan.py
          sudo python3 scripts/test-gateway-install-executor.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: agent/go.mod

      - name: Test Agent
        working-directory: agent
        run: go test ./...

      - name: Controller discovery and maintenance race checks
        working-directory: agent
        run: go test -race ./internal/controllerconfig ./cmd/incudal-maintenance

  billing-expiry-integration:
    name: Billing expiry integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expiry_test
          POSTGRES_PASSWORD: expiry_test
          POSTGRES_DB: ci_expiry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://expiry_test:expiry_test@127.0.0.1:5432/ci_expiry_test
      BILLING_EXPIRY_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare isolated schema
        run: |
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify expiry retry and renewal accounting
        run: pnpm --filter server test:billing-expiry-integration
      - name: Verify host DNS deployment state
        run: pnpm --filter server test:host-gateway-dns-integration
        env:
          HOST_GATEWAY_DNS_INTEGRATION_TEST: '1'

  pool-delivery-integration:
    name: Pool delivery and deletion integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pool_test
          POSTGRES_PASSWORD: pool_test
          POSTGRES_DB: ci_release_pool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pool_test:pool_test@127.0.0.1:5432/ci_release_pool_test
      JWT_SECRET: isolated-ci-pool-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install isolated test dependencies and schema
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify pool accounting, IPv6 and actual TLS deletion boundary
        run: |
          pnpm --filter server test:host-pool-integration
          pnpm --filter server test:host-public-ipv6-integration
          pnpm --filter server test:admin-instance-delete-integration
          pnpm --filter server test:destroy-email-verification
      - name: Verify backup upload authorization, queue races and export completion
        run: |
          pnpm --filter server test:review-upload-completion-integration
          pnpm --filter server test:review-backup-export
          pnpm --filter server test:review-restore-transport
          pnpm --filter server test:review-restore-authorization
          pnpm --filter server test:review-restore-replacement
      - name: Verify ticket pagination against PostgreSQL
        run: |
          pnpm --filter server test:review-ticket-pagination
          pnpm --filter server test:review-ticket-target
          pnpm --filter server test:review-ticket-authorization
          pnpm --filter server test:review-ticket-image-proxy
          pnpm --filter server test:review-ticket-public-authorization
      - name: Verify traffic reset authorization against PostgreSQL
        run: |
          pnpm --filter server test:review-traffic-reset-auth
          pnpm --filter server test:review-traffic-limit
      - name: Verify managed provision cleanup against PostgreSQL and mTLS
        run: pnpm --filter server test:review-managed-provision
      - name: Public IPv4 allocation and row locks
        run: pnpm --filter server test:review-public-ipv4
      - name: Host gift preparation and notification failures
