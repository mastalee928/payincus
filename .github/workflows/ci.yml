name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint
        run: pnpm lint

      - name: Repository and installer guards
        run: |
          pnpm --filter server test:sample-seed-safety
          pnpm --filter server type-check:sample-seed
          node scripts/test-repository-source-guards.mjs
          pnpm --filter server test:host-install-inputs
          bash scripts/test-install-panel-guards.sh
          python3 scripts/test-onboarding-control.py
          python3 scripts/test-onboarding-gateway.py
          sudo python3 -B scripts/test-host-gateway-dns.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iproute2
          sudo env INCUDAL_NETWORK_NAMESPACE_TEST=1 unshare --net python3 scripts/test-onboarding-control-network.py

      - name: Type check (client)
        run: pnpm --filter client type-check

      - name: Type check (server)
        run: pnpm --filter server type-check

      - name: Controller candidate and discovery guards
        run: pnpm --filter server test:controller-config-guards

      - name: Management gateway task guards
        run: |
          pnpm --filter server test:gateway-task-guards
          pnpm --filter server test:gateway-management-route-guards
          node scripts/run-tests.mjs --only simple-gateway-setup
          python3 scripts/test-management-gateway-preflight.py
          sudo python3 scripts/test-gateway-component-package.py
          sudo python3 scripts/test-gateway-install-plan.py
          sudo python3 scripts/test-gateway-install-executor.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: agent/go.mod

      - name: Test Agent
        working-directory: agent
        run: go test ./...

      - name: Controller discovery and maintenance race checks
        working-directory: agent
        run: go test -race ./internal/controllerconfig ./cmd/incudal-maintenance

  billing-expiry-integration:
    name: Billing expiry integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expiry_test
          POSTGRES_PASSWORD: expiry_test
          POSTGRES_DB: ci_expiry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://expiry_test:expiry_test@127.0.0.1:5432/ci_expiry_test
      BILLING_EXPIRY_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare isolated schema
        run: |
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify expiry retry and renewal accounting
        run: pnpm --filter server test:billing-expiry-integration
      - name: Verify host DNS deployment state
        run: pnpm --filter server test:host-gateway-dns-integration
        env:
          HOST_GATEWAY_DNS_INTEGRATION_TEST: '1'

  pool-delivery-integration:
    name: Pool delivery and deletion integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pool_test
          POSTGRES_PASSWORD: pool_test
          POSTGRES_DB: ci_release_pool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pool_test:pool_test@127.0.0.1:5432/ci_release_pool_test
      JWT_SECRET: isolated-ci-pool-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install isolated test dependencies and schema
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify pool accounting, IPv6 and actual TLS deletion boundary
        run: |
          pnpm --filter server test:host-pool-integration
          pnpm --filter server test:host-public-ipv6-integration
          pnpm --filter server test:admin-instance-delete-integration
      - name: Verify backup upload authorization, queue races and export completion
        run: |
          pnpm --filter server test:review-upload-completion-integration
          pnpm --filter server test:review-backup-export
          pnpm --filter server test:review-restore-transport
          pnpm --filter server test:review-restore-authorization
          pnpm --filter server test:review-restore-replacement
      - name: Verify ticket pagination against PostgreSQL
        run: |
          pnpm --filter server test:review-ticket-pagination
          pnpm --filter server test:review-ticket-target
          pnpm --filter server test:review-ticket-authorization
          pnpm --filter server test:review-ticket-image-proxy
          pnpm --filter server test:review-ticket-public-authorization
      - name: Verify traffic reset authorization against PostgreSQL
        run: |
          pnpm --filter server test:review-traffic-reset-auth
          pnpm --filter server test:review-traffic-limit
      - name: Verify managed provision cleanup against PostgreSQL and mTLS
        run: pnpm --filter server test:review-managed-provision
      - name: Public IPv4 allocation and row locks
        run: pnpm --filter server test:review-public-ipv4
      - name: Host gift preparation and notification failures
        run: pnpm --filter server test:review-host-gift-preparation
      - name: Host network observation identity and generation
        run: |
          pnpm --filter server test:review-host-network-sync
          pnpm --filter server test:review-network-persistence
      - name: Instance quota override semantics
        run: pnpm --filter server test:review-instance-quota
      - name: Dedicated machines cannot enter legacy package migration
        run: pnpm --filter server test:review-host-migrate-dedicated
      - name: Storage capacity API validates before connecting to hosts
        run: pnpm --filter server test:review-storage-size
      - name: Storage updates preserve descriptions and reject stale configuration versions
        run: pnpm --filter server test:review-storage-update
      - name: Storage import requires confirmed absence and valid existing pool metadata
        run: pnpm --filter server test:review-storage-import
      - name: Storage purpose updates verify current access and commit with their audit
        run: pnpm --filter server test:review-storage-purpose
      - name: Price updates roll back billing changes when the operation audit fails
        run: pnpm --filter server test:review-billing-price-audit
      - name: Direct balance adjustments commit their ledger and audit atomically
        run: pnpm --filter server test:review-user-balance-audit
      - name: Points adjustments recheck current administrators and retain atomic audit
        run: pnpm --filter server test:review-user-points-write
      - name: Hosting adjustments commit their balance, frozen ledger and audit together
        run: pnpm --filter server test:review-user-hosting-write
      - name: Host lists preserve architecture, network state and stable cross-owner pagination
        run: pnpm --filter server test:review-host-pagination
      - name: Gifted days preserve current ownership and paid expiry
        run: pnpm --filter server test:review-host-gift-days
      - name: Instance detail reads stay on the current route and session
        run: pnpm --filter server test:review-instance-detail-reads
      - name: Transfer and verification modals keep the current draft and session
        run: pnpm --filter server test:review-transfer-modal-lifecycle
      - name: Plan upgrades submit only the current approved preview
        run: pnpm --filter server test:review-change-plan-lifecycle
      - name: Cached terminals release page shortcuts and discard late clipboard reads
        run: pnpm --filter server test:review-terminal-lifecycle
      - name: Terminal sessions reject old identity and connection results
        run: pnpm --filter server test:review-terminal-session
      - name: Saved commands preserve drafts and current account state
        run: pnpm --filter server test:review-terminal-commands-lifecycle
      - name: Ticket details and replies preserve the current page and draft
        run: pnpm --filter server test:review-ticket-lifecycle
      - name: Ticket actions keep their original target and preserve later drafts
        run: pnpm --filter server test:review-ticket-actions
      - name: Ticket instance cards discard stale actions and release all polling
        run: pnpm --filter server test:review-ticket-instance-card
      - name: Batch renewal and destruction submit only the approved preview targets
        run: pnpm --filter server test:review-instance-batch-billing
      - name: Legacy create coupons preserve the current quote and hosting source
        run: pnpm --filter server test:review-create-promo
      - name: Instance logs preserve current search and instance context
        run: pnpm --filter server test:review-instance-logs
      - name: Reinstall dialogs submit only current images and keys
        run: pnpm --filter server test:review-reinstall-selection
      - name: Port conflicts reject malformed and duplicate ports
        run: pnpm --filter server test:review-port-conflict
      - name: Ticket attachment controls honor disabled state
        run: pnpm --filter server test:review-ticket-uploader
      - name: Host instance reads stay bound to current host and session
        run: pnpm --filter server test:review-host-instance-reads
      - name: Host deletion keeps reviewed targets and current results
        run: pnpm --filter server test:review-host-delete-lifecycle
      - name: Host batch state actions keep targets and current results
        run: pnpm --filter server test:review-host-batch-actions
      - name: Host gifts keep paid targets and current results
        run: pnpm --filter server test:review-host-gift-lifecycle
      - name: Host renewal prices keep targets and newer drafts
        run: pnpm --filter server test:review-host-price-lifecycle
      - name: Host traffic resets keep targets and committed success
        run: pnpm --filter server test:review-host-reset-lifecycle
      - name: Host notifications keep recipients and newer drafts
        run: pnpm --filter server test:review-host-notify-lifecycle
      - name: Host recreation keeps prepared options and original targets
        run: pnpm --filter server test:review-host-recreate-lifecycle
      - name: Host single actions guard preparation and old receipts
        run: pnpm --filter server test:review-host-single-actions
      - name: Host batch config keeps reviewed targets and failed-only retries
        run: pnpm --filter server test:review-host-batch-config
      - name: Host batch configuration numeric and zero values
        run: pnpm --filter server test:review-host-batch-config-inputs
      - name: Host batch configuration role permissions
        run: pnpm --filter server test:review-host-batch-config-roles
      - name: Resource-specific quota display and detail tabs
        run: |
          pnpm --filter server test:review-host-quota-display
          pnpm --filter server test:review-quota-views
      - name: Instance quota editor retains current values and drafts
        run: pnpm --filter server test:review-instance-quota-editor
      - name: Instance quota submission validates values and lifecycle
        run: pnpm --filter server test:review-instance-quota-submit
      - name: Host storage reads stay with the current host and session
        run: pnpm --filter server test:review-host-storage-reads
      - name: Host storage writes retain their original target and result
        run: pnpm --filter server test:review-host-storage-writes
      - name: Host storage capacity validates numeric input and units
        run: pnpm --filter server test:review-host-storage-inputs
      - name: Admin price changes require the current settlement preview
        run: pnpm --filter server test:review-billing-price-preview
      - name: Admin price writes keep their draft and session through completion
        run: pnpm --filter server test:review-billing-price-submit
      - name: User balance and login dialogs keep their current target and read scope
        run: pnpm --filter server test:review-user-dialog-reads
      - name: Hosting balance reads keep their current target and tab
        run: pnpm --filter server test:review-user-hosting-reads
      - name: Hosting adjustments retain their target and confirmed receipt
        run: pnpm --filter server test:review-user-hosting-submit
      - name: Two-factor setup and settings prevent concurrent submissions
        run: pnpm --filter server test:review-two-factor-busy
      - name: Balance adjustments keep their target, draft and confirmed receipt
        run: pnpm --filter server test:review-user-balance-submit
      - name: Points adjustments reject stale receipts and repeated submissions
        run: pnpm --filter server test:review-user-points-submit
      - name: Host redeem reads stay with the current host and code
        run: pnpm --filter server test:review-host-redeem-reads
      - name: Host redeem writes retain their selected target and result
        run: pnpm --filter server test:review-host-redeem-writes
      - name: Host redeem copies and batch dialogs stay with the current context
        run: pnpm --filter server test:review-host-redeem-copy
      - name: Host migration reads stay with the selected destination
        run: pnpm --filter server test:review-host-migrate-reads
      - name: Host migration writes retain their selected targets and results
        run: pnpm --filter server test:review-host-migrate-writes
      - name: Host migration parent fixes selection and validates current identities
        run: pnpm --filter server test:review-host-migrate-parent
      - name: Verify init command selector in Chrome
        run: pnpm --filter server test:review-init-command-selector
      - name: Verify init command modals in Chrome
        run: pnpm --filter server test:review-init-command-modals
      - name: Verify static caching in Chrome
        run: pnpm --filter server test:review-service-worker-browser
      - name: Verify package form in Chrome
        run: pnpm --filter server test:review-package-form
      - name: Verify expiry panel lifecycle in Chrome
        run: pnpm --filter server test:review-expiry-panel
      - name: Verify badge image recovery in Chrome
        run: pnpm --filter server test:review-badge-image
      - name: Verify badge motion in Chrome
        run: pnpm --filter server test:review-badge-motion
      - name: Verify badge center lifecycle in Chrome
        run: pnpm --filter server test:review-badge-center
      - name: Verify instance badge modal in Chrome
        run: pnpm --filter server test:review-instance-badge
      - name: Verify prize stock and editor
        run: |
          pnpm --filter server test:review-prize-stock
          pnpm --filter server test:review-prize-editor
      - name: Verify VIP reward description clearing
        run: pnpm --filter server test:review-vip-reward-description
      - name: Verify VIP reward editor in Chrome
        run: pnpm --filter server test:review-vip-reward-editor
      - name: Verify VIP benefit hall in Chrome
        run: pnpm --filter server test:review-vip-benefit-hall
      - name: Verify VIP level rule editor in Chrome
        run: pnpm --filter server test:review-vip-level-rules
      - name: Verify host instance editor in Chrome
        run: pnpm --filter server test:review-host-create-instance
      - name: Verify administrator pool creation in Chrome
        run: |
          pnpm --filter server test:review-admin-pool-create
          pnpm --filter server test:review-admin-pool-create-load
          pnpm --filter server test:review-admin-pool-create-entry
          pnpm --filter server test:review-admin-package-create
          pnpm --filter server test:review-admin-package-options
      - name: Verify terms language in Chrome
        run: |
          pnpm --filter server test:review-terms-language
          pnpm --filter server test:review-terms-lifecycle
      - name: Verify Markdown rendering in Chrome
        run: |
          pnpm --filter server test:review-markdown-browser
          pnpm --filter server test:review-markdown-attributes
      - name: Verify payment locales in Chrome
        run: pnpm --filter server test:review-payment-locales
      - name: Verify package empty fields in PostgreSQL
        run: pnpm --filter server test:review-package-empty-fields

  remote-gateway-setup-integration:
    name: Remote gateway setup journal integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway_test
          POSTGRES_DB: ci_remote_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gateway_test:gateway_test@127.0.0.1:5432/ci_remote_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Prepare isolated schema
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify persistent planning, DNS pinning and credential boundaries
        run: pnpm --filter server test:remote-gateway-setup-integration

  gateway-component-package:
    name: Gateway component package (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: agent/go.mod
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify isolated package
        env:
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          umask 077
          test_root=$(mktemp -d "$RUNNER_TEMP/gateway-package-XXXXXX")
          node_runtime=$(command -v node)
          go_runtime=$(command -v go)
          openssl genpkey -algorithm Ed25519 -out "$test_root/signing.pem"
          openssl pkey -in "$test_root/signing.pem" -pubout -outform DER | tail -c 32 | base64 -w0 > "$test_root/pinned.pub"
          node scripts/build-gateway-component-package.mjs --out "$test_root/package" --architecture "$PACKAGE_ARCH" --node "$node_runtime" --go "$go_runtime" --signing-key "$test_root/signing.pem"
          protected_root=$(sudo mktemp -d /root/incudal-component-ci-XXXXXX)
          sudo cp -R --preserve=mode --no-preserve=ownership "$test_root/package" "$protected_root/package"
          sudo install -m 600 "$test_root/pinned.pub" "$protected_root/pinned.pub"
          sudo python3 -B scripts/test-gateway-controller-enrollment.py
          sudo python3 -B scripts/test-gateway-controller-provisioning.py
          sudo python3 scripts/verify-gateway-component-package.py "$protected_root/package" "$protected_root/pinned.pub" "$PACKAGE_ARCH" "$(node -p 'require("./server/package.json").version')" "$(git rev-parse HEAD)"
          sudo env GATEWAY_COMPONENT_PACKAGE="$protected_root/package" "$node_runtime" --import "$PWD/server/node_modules/tsx/dist/loader.mjs" "$PWD/server/scripts/test-gateway-component-integration.ts"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Build
        run: pnpm build
