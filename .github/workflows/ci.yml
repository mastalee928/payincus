name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint
        run: pnpm lint

      - name: Repository and installer guards
        run: |
          node scripts/test-repository-source-guards.mjs
          bash scripts/test-install-panel-guards.sh
          python3 scripts/test-onboarding-control.py
          python3 scripts/test-onboarding-gateway.py
          sudo python3 -B scripts/test-host-gateway-dns.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iproute2
          sudo env INCUDAL_NETWORK_NAMESPACE_TEST=1 unshare --net python3 scripts/test-onboarding-control-network.py

      - name: Type check (client)
        run: pnpm --filter client type-check

      - name: Type check (server)
        run: pnpm --filter server type-check

      - name: Controller candidate and discovery guards
        run: pnpm --filter server test:controller-config-guards

      - name: Management gateway task guards
        run: |
          pnpm --filter server test:gateway-task-guards
          pnpm --filter server test:gateway-management-route-guards
          node scripts/run-tests.mjs --only simple-gateway-setup
          python3 scripts/test-management-gateway-preflight.py
          sudo python3 scripts/test-gateway-component-package.py
          sudo python3 scripts/test-gateway-install-plan.py
          sudo python3 scripts/test-gateway-install-executor.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: agent/go.mod

      - name: Test Agent
        working-directory: agent
        run: go test ./...

      - name: Controller discovery and maintenance race checks
        working-directory: agent
        run: go test -race ./internal/controllerconfig ./cmd/incudal-maintenance

  billing-expiry-integration:
    name: Billing expiry integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: expiry_test
          POSTGRES_PASSWORD: expiry_test
          POSTGRES_DB: ci_expiry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://expiry_test:expiry_test@127.0.0.1:5432/ci_expiry_test
      BILLING_EXPIRY_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare isolated schema
        run: |
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify expiry retry and renewal accounting
        run: pnpm --filter server test:billing-expiry-integration
      - name: Verify host DNS deployment state
        run: pnpm --filter server test:host-gateway-dns-integration
        env:
          HOST_GATEWAY_DNS_INTEGRATION_TEST: '1'

  pool-delivery-integration:
    name: Pool delivery and deletion integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pool_test
          POSTGRES_PASSWORD: pool_test
          POSTGRES_DB: ci_release_pool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pool_test:pool_test@127.0.0.1:5432/ci_release_pool_test
      JWT_SECRET: isolated-ci-pool-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install isolated test dependencies and schema
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify pool accounting, IPv6 and actual TLS deletion boundary
        run: |
          pnpm --filter server test:host-pool-integration
          pnpm --filter server test:host-public-ipv6-integration
          pnpm --filter server test:admin-instance-delete-integration
      - name: Verify backup upload authorization, queue races and export completion
        run: |
          pnpm --filter server test:review-upload-completion-integration
          pnpm --filter server test:review-backup-export
          pnpm --filter server test:review-restore-transport
          pnpm --filter server test:review-restore-authorization
          pnpm --filter server test:review-restore-replacement
      - name: Verify ticket pagination against PostgreSQL
        run: |
          pnpm --filter server test:review-ticket-pagination
          pnpm --filter server test:review-ticket-target
          pnpm --filter server test:review-ticket-authorization
          pnpm --filter server test:review-ticket-image-proxy
          pnpm --filter server test:review-ticket-public-authorization
      - name: Verify init command selector in Chrome
        run: pnpm --filter server test:review-init-command-selector
      - name: Verify init command modals in Chrome
        run: pnpm --filter server test:review-init-command-modals
      - name: Verify static caching in Chrome
        run: pnpm --filter server test:review-service-worker-browser
      - name: Verify package form in Chrome
        run: pnpm --filter server test:review-package-form
      - name: Verify package empty fields in PostgreSQL
        run: pnpm --filter server test:review-package-empty-fields

  remote-gateway-setup-integration:
    name: Remote gateway setup journal integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway_test
          POSTGRES_DB: ci_remote_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gateway_test:gateway_test@127.0.0.1:5432/ci_remote_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Prepare isolated schema
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify persistent planning, DNS pinning and credential boundaries
        run: pnpm --filter server test:remote-gateway-setup-integration

  gateway-component-package:
    name: Gateway component package (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: agent/go.mod
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify isolated package
        env:
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          umask 077
          test_root=$(mktemp -d "$RUNNER_TEMP/gateway-package-XXXXXX")
          node_runtime=$(command -v node)
          go_runtime=$(command -v go)
          openssl genpkey -algorithm Ed25519 -out "$test_root/signing.pem"
          openssl pkey -in "$test_root/signing.pem" -pubout -outform DER | tail -c 32 | base64 -w0 > "$test_root/pinned.pub"
          node scripts/build-gateway-component-package.mjs --out "$test_root/package" --architecture "$PACKAGE_ARCH" --node "$node_runtime" --go "$go_runtime" --signing-key "$test_root/signing.pem"
          protected_root=$(sudo mktemp -d /root/incudal-component-ci-XXXXXX)
          sudo cp -R --preserve=mode --no-preserve=ownership "$test_root/package" "$protected_root/package"
          sudo install -m 600 "$test_root/pinned.pub" "$protected_root/pinned.pub"
          sudo python3 -B scripts/test-gateway-controller-enrollment.py
          sudo python3 -B scripts/test-gateway-controller-provisioning.py
          sudo python3 scripts/verify-gateway-component-package.py "$protected_root/package" "$protected_root/pinned.pub" "$PACKAGE_ARCH" "$(node -p 'require("./server/package.json").version')" "$(git rev-parse HEAD)"
          sudo env GATEWAY_COMPONENT_PACKAGE="$protected_root/package" "$node_runtime" --import "$PWD/server/node_modules/tsx/dist/loader.mjs" "$PWD/server/scripts/test-gateway-component-integration.ts"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Build
        run: pnpm build
