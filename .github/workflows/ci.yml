  remote-gateway-setup-integration:
    name: Remote gateway setup journal integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway_test
          POSTGRES_DB: ci_remote_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gateway_test:gateway_test@127.0.0.1:5432/ci_remote_gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Prepare isolated schema
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter server exec prisma generate
          pnpm --filter server exec prisma migrate deploy
      - name: Verify persistent planning, DNS pinning and credential boundaries
        run: pnpm --filter server test:remote-gateway-setup-integration

  gateway-component-package:
    name: Gateway component package (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: agent/go.mod
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify isolated package
        env:
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          umask 077
          test_root=$(mktemp -d "$RUNNER_TEMP/gateway-package-XXXXXX")
          node_runtime=$(command -v node)
          go_runtime=$(command -v go)
          openssl genpkey -algorithm Ed25519 -out "$test_root/signing.pem"
          openssl pkey -in "$test_root/signing.pem" -pubout -outform DER | tail -c 32 | base64 -w0 > "$test_root/pinned.pub"
          node scripts/build-gateway-component-package.mjs --out "$test_root/package" --architecture "$PACKAGE_ARCH" --node "$node_runtime" --go "$go_runtime" --signing-key "$test_root/signing.pem"
          protected_root=$(sudo mktemp -d /root/incudal-component-ci-XXXXXX)
          sudo cp -R --preserve=mode --no-preserve=ownership "$test_root/package" "$protected_root/package"
          sudo install -m 600 "$test_root/pinned.pub" "$protected_root/pinned.pub"
          sudo python3 -B scripts/test-gateway-controller-enrollment.py
          sudo python3 -B scripts/test-gateway-controller-provisioning.py
          sudo python3 scripts/verify-gateway-component-package.py "$protected_root/package" "$protected_root/pinned.pub" "$PACKAGE_ARCH" "$(node -p 'require("./server/package.json").version')" "$(git rev-parse HEAD)"
          sudo env GATEWAY_COMPONENT_PACKAGE="$protected_root/package" "$node_runtime" --import "$PWD/server/node_modules/tsx/dist/loader.mjs" "$PWD/server/scripts/test-gateway-component-integration.ts"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Build
        run: pnpm build
