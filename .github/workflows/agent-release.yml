name: Agent Build & Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'agent/**'
      - 'server/templates/agent-install.sh'
      - 'server/src/routes/agent.ts'
      - 'server/src/lib/agent-auth.ts'
      - 'server/src/lib/host-agent-credentials.ts'
      - 'server/src/services/agent-instance-report.ts'
      - 'scripts/test-dedicated-ipv6-network.py'
      - 'scripts/configure-oci-node-network.sh'
      - '.github/workflows/agent-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'server/templates/agent-install.sh'
      - 'server/src/routes/agent.ts'
      - 'server/src/lib/agent-auth.ts'
      - 'server/src/lib/host-agent-credentials.ts'
      - 'server/src/services/agent-instance-report.ts'
      - 'scripts/test-dedicated-ipv6-network.py'
      - 'scripts/configure-oci-node-network.sh'
      - '.github/workflows/agent-release.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish an Agent GitHub Release using the version in agent/VERSION.'
        required: false
        default: false
        type: boolean

env:
  GO_VERSION: '1.22.x'

jobs:
  version:
    name: Resolve Agent Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.changed.outputs.version_changed }}
      should_release: ${{ steps.release.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Agent version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < agent/VERSION)"

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Agent version: ${VERSION}" >&2
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Agent version: ${VERSION}"

      - name: Detect agent/VERSION change
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          VERSION_CHANGED=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
              VERSION_CHANGED=true
            elif git diff --name-only "${BEFORE}" "${AFTER}" | grep -qx 'agent/VERSION'; then
              VERSION_CHANGED=true
            fi
          fi

          echo "version_changed=${VERSION_CHANGED}" >> "${GITHUB_OUTPUT}"
          echo "agent/VERSION changed: ${VERSION_CHANGED}"

      - name: Decide release publishing
        id: release
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_RELEASE=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${{ steps.changed.outputs.version_changed }}" == "true" ]]; then
            SHOULD_RELEASE=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            SHOULD_RELEASE=true
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "should release: ${SHOULD_RELEASE}"

  build-agent:
    name: Build Agent
    runs-on: ubuntu-latest
    needs:
      - version
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.mod

      - name: Test Agent
        working-directory: agent
        run: go test ./...

      - name: Test IPv6 packet delivery and address lifecycle
        working-directory: agent
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 nftables iputils-ping python3 util-linux
          sudo env "PATH=$PATH" INCUDAL_IPV6_NETNS_TEST=1 go test -count=1 -v ./internal/dedicatedipv6

      - name: Build Agent release files
        run: VERSION="${{ needs.version.outputs.version }}" bash agent/scripts/build-release.sh

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p agent/release

          cp agent/dist/incudal-agent-linux-amd64 "agent/release/incudal-agent-x86_64-${VERSION}"
          cp agent/dist/incudal-agent-linux-arm64 "agent/release/incudal-agent-aarch64-${VERSION}"
          cp LICENSE agent/release/LICENSE

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          test -s "agent/release/incudal-agent-x86_64-${VERSION}"
          test -s "agent/release/incudal-agent-aarch64-${VERSION}"

      - name: Upload Agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: incudal-agent-${{ needs.version.outputs.version }}
          path: |
            agent/release/incudal-agent-x86_64-${{ needs.version.outputs.version }}
            agent/release/incudal-agent-aarch64-${{ needs.version.outputs.version }}
            agent/release/LICENSE
          retention-days: 30

  guest-protection:
    name: Customer network protection (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agent/go.mod
      - name: Prepare disposable Linux network tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 nftables iptables python3 util-linux
      - name: Native pool host BBR, customer preservation and automatic repair
        run: |
          (cd agent && CGO_ENABLED=0 go test -c -o /tmp/incudal-bbr-tests ./internal/performance)
          sudo env INCUDAL_BBR_NATIVE_TEST=1 /tmp/incudal-bbr-tests -test.v
      - name: Native metadata isolation, management source protection and normal customer packets
        run: |
          (cd agent && CGO_ENABLED=0 go test -c -o /tmp/incudal-guest-guard-tests ./internal/guestguard)
          sudo env INCUDAL_GUEST_GUARD_NATIVE=1 /tmp/incudal-guest-guard-tests -test.v
      - name: Native systemd boot dependency failure and automatic continuation
        run: |
          (cd agent && CGO_ENABLED=0 go build -o /tmp/incudal-agent-probe ./cmd/incudal-agent)
          sudo env INCUDAL_GUEST_GUARD_SERVICE_TEST=1 INCUDAL_GUEST_GUARD_AGENT_BINARY=/tmp/incudal-agent-probe /tmp/incudal-guest-guard-tests -test.run TestNativeBootDependencyContinuation -test.v
      - name: Native Alpine OpenRC dependency failure and automatic continuation
        run: |
          docker run --rm --privileged -v /tmp/incudal-guest-guard-tests:/test:ro -v /tmp/incudal-agent-probe:/agent:ro alpine:3.24 sh -ec '
            apk add --no-cache openrc nftables
            mkdir -p /run/openrc
            touch /run/openrc/softlevel
            rc-service localmount start
            INCUDAL_GUEST_GUARD_SERVICE_TEST=1 INCUDAL_GUEST_GUARD_AGENT_BINARY=/agent /test -test.run TestNativeBootDependencyContinuation -test.v
          '

  release-agent:
    name: Publish Agent Release
    runs-on: ubuntu-latest
    needs:
      - version
      - build-agent
      - guest-protection
    if: needs.version.outputs.should_release == 'true'
    permissions:
      contents: write
    concurrency:
      group: agent-release-${{ needs.version.outputs.version }}
      cancel-in-progress: false

    steps:
      - name: Checkout publication validator
        uses: actions/checkout@v4
      - name: Setup publication validator
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download Agent artifacts
        uses: actions/download-artifact@v4
        with:
          name: incudal-agent-${{ needs.version.outputs.version }}
          path: agent-release

      - name: Verify immutable Agent release identity
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-agent-release-state.mjs '${{ needs.version.outputs.version }}' '${{ github.sha }}' agent-release

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Incudal Agent ${{ needs.version.outputs.version }}
          files: |
            agent-release/incudal-agent-x86_64-${{ needs.version.outputs.version }}
            agent-release/incudal-agent-aarch64-${{ needs.version.outputs.version }}
            agent-release/LICENSE
          generate_release_notes: true
          draft: false
          make_latest: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false
