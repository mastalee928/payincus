name: Alpine Incus compatibility runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/test-incus-sysinfo-compat.sh'
      - '.github/workflows/incus-sysinfo-native.yml'
jobs:
  runtime:
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download independently verified fixed-source compatibility build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43510197753 --name incudal-incusd-sysinfo-${{ matrix.architecture }} --dir output
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('output');m=json.loads((p/'incusd-manifest.json').read_text());b=(p/'incusd').read_bytes()
          assert m['sourceSha256']=='5e415fa1684f0945d45ca780af6662f143b857681e18d29038725cde70c26ee6'
          assert m['patchedSourceSha256']=='bad35c2986663bddeddb94e088969ba1671446dc08875da6a6727e996334f12a'
          assert hashlib.sha256(b).hexdigest()==m['sha256'] and len(b)==m['size']
          PY
      - name: Original daemon reload retains guest and corrects real sysinfo
        run: |
          set -euo pipefail
          arch=x86_64; digest=cdaa38cb8de3537967ee5b6c9b6cd00cc962da2b018e6eea48696bb274923012
          if [[ '${{ matrix.architecture }}' == arm64 ]]; then arch=aarch64; digest=4b14c18f7e90a063b61462ea1462a5732c154bf6adad594974fe6487cd98a8de; fi
          root=$(mktemp -d)
          curl -fsSLo alpine.tar.gz "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/$arch/alpine-minirootfs-3.24.4-$arch.tar.gz"
          printf '%s  alpine.tar.gz\n' "$digest" | sha256sum -c -
          sudo tar -xzf alpine.tar.gz -C "$root"
          sudo cp /etc/resolv.conf "$root/etc/resolv.conf"
          sudo mkdir -p "$root/out"
          sudo cp output/incusd "$root/out/incusd"
          sudo cp scripts/test-incus-sysinfo-compat.sh "$root/test.sh"
          sudo mount --rbind /dev "$root/dev"
          sudo mount --make-rslave "$root/dev"
          sudo mount -t proc proc "$root/proc"
          sudo mount --rbind /sys "$root/sys"
          sudo mount --make-rslave "$root/sys"
          # Ubuntu restricts user namespaces for the Alpine chroot executable,
          # which has no Ubuntu AppArmor profile. Only this disposable runtime
          # fixture adjusts that host restriction; product rules stay intact.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo env INCUDAL_SYSINFO_COMPAT_TEST=disposable chroot "$root" /bin/sh -ec 'apk add --no-cache go; sh /test.sh'
