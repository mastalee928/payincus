name: Alpine Incus compatibility runtime
on:
  workflow_dispatch:
jobs:
  runtime:
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download independently verified fixed-source compatibility build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43510197753 --name incudal-incusd-sysinfo-${{ matrix.architecture }} --dir output
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('output');m=json.loads((p/'incusd-manifest.json').read_text());b=(p/'incusd').read_bytes()
          assert m['sourceSha256']=='5e415fa1684f0945d45ca780af6662f143b857681e18d29038725cde70c26ee6'
          assert m['patchedSourceSha256']=='bad35c2986663bddeddb94e088969ba1671446dc08875da6a6727e996334f12a'
          assert hashlib.sha256(b).hexdigest()==m['sha256'] and len(b)==m['size']
          PY
      - name: Original daemon reload retains guest and corrects real sysinfo
        run: |
          sudo systemctl start incudalsysinfo.slice
          echo '+cpuset +cpu +io +memory +pids' | sudo tee /sys/fs/cgroup/incudalsysinfo.slice/cgroup.subtree_control
          docker run --rm --privileged --cgroupns=host --cgroup-parent=incudalsysinfo.slice -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD/output:/out:ro" -v "$PWD/scripts/test-incus-sysinfo-compat.sh:/test.sh:ro" -e INCUDAL_SYSINFO_COMPAT_TEST=disposable alpine:3.24 sh -ec '
            apk add --no-cache go
            sh /test.sh
          '

