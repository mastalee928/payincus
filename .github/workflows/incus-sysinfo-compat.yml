name: Alpine Incus sysinfo compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-incus-sysinfo-compat.py'
      - 'scripts/test-incus-sysinfo-compat.sh'
      - '.github/workflows/incus-sysinfo-compat.yml'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned official daemon with anchored upstream monitor fix
        run: |
          mkdir -p output
          docker run --rm -v "$PWD/scripts/build-incus-sysinfo-compat.py:/build.py:ro" -v "$PWD/output:/out" alpine:3.24 sh -ec '
            apk add --no-cache go python3 build-base acl-dev cowsql-dev raft-cowsql-dev eudev-dev libcap-dev libuv-dev linux-headers lxc-dev lz4-dev sqlite-dev gettext-dev
            python3 /build.py
          '
      - name: Original daemon reload retains guest and corrects real sysinfo
        run: |
          sudo mkdir -p /sys/fs/cgroup/incudal-sysinfo-test
          echo '+cpuset +cpu +io +memory +pids' | sudo tee /sys/fs/cgroup/incudal-sysinfo-test/cgroup.subtree_control
          docker run --rm --privileged --cgroupns=host --cgroup-parent=/incudal-sysinfo-test -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD/output:/out:ro" -v "$PWD/scripts/test-incus-sysinfo-compat.sh:/test.sh:ro" -e INCUDAL_SYSINFO_COMPAT_TEST=disposable alpine:3.24 sh -ec '
            apk add --no-cache go
            sh /test.sh
          '
      - uses: actions/upload-artifact@v4
        with:
          name: incudal-incusd-sysinfo-${{ matrix.architecture }}
          path: output/
          retention-days: 14
