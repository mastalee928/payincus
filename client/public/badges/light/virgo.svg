<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="w-full h-full"><style>body { font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.5s, color 0.5s; }
    /* 全局星座基础动画 */
    .node-fire { animation: f-flicker 0.2s infinite alternate; }
    .line-fire { stroke-dasharray: 10 10; animation: f-flow 1s linear infinite; }
    .node-air { animation: a-pulse 1s infinite alternate; }

    /* 水象专属强化 */
    .wrap-water { animation: w-float 4s ease-in-out infinite alternate; }
    .node-water { animation: w-glow 1.5s ease-in-out infinite alternate; }
    .line-water { stroke-dasharray: 12 24; animation: w-flow 2s linear infinite; }
    .node-water-ripple { animation: w-ripple 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }

    /* 土象专属强化 */
    .node-earth { animation: e-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .line-earth { stroke-dasharray: 20 40; animation: e-flow 2s linear infinite; }
    .e-scan-line { animation: e-scan 3s linear infinite; }
    .e-rot-box { transform-origin: 120px 120px; animation: e-rot 10s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }

    @keyframes f-flicker { 0% { opacity: 0.6; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.2); } }
    @keyframes f-flow { 100% { stroke-dashoffset: -20; } }
    @keyframes a-pulse { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.5); filter: brightness(1.5); } }

    /* 新增水象/土象关键帧 */
    @keyframes w-float { 0% { transform: translateY(-5px); } 100% { transform: translateY(5px); } }
    @keyframes w-glow { 0% { opacity: 0.5; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.3); filter: brightness(1.3); } }
    @keyframes w-ripple { 0% { r: 5px; opacity: 1; stroke-width: 4; } 100% { r: 35px; opacity: 0; stroke-width: 0; } }
    @keyframes w-flow { 100% { stroke-dashoffset: -36; } }

    @keyframes e-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.6); } }
    @keyframes e-flow { 100% { stroke-dashoffset: -60; } }
    @keyframes e-scan { 0% { transform: translateY(-100px); opacity: 0; } 10%, 90% { opacity: 1; } 100% { transform: translateY(100px); opacity: 0; } }
    @keyframes e-rot { 100% { transform: rotate(90deg); } }
</style><defs>
<filter id="glow-neon-d" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
  <feMerge>
    <feMergeNode in="blur"></feMergeNode>
    <feMergeNode in="SourceGraphic"></feMergeNode>
  </feMerge>
</filter>
<filter id="glow-intense-d" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="8" result="b1"></feGaussianBlur>
  <feGaussianBlur stdDeviation="3" result="b2"></feGaussianBlur>
  <feMerge>
    <feMergeNode in="b1"></feMergeNode>
    <feMergeNode in="b2"></feMergeNode>
    <feMergeNode in="SourceGraphic"></feMergeNode>
  </feMerge>
</filter>
<filter id="glow-neon-l" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.2" result="shadow"></feDropShadow>
  <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow"></feGaussianBlur>
  <feMerge>
    <feMergeNode in="shadow"></feMergeNode>
    <feMergeNode in="glow"></feMergeNode>
    <feMergeNode in="SourceGraphic"></feMergeNode>
  </feMerge>
</filter>
<filter id="glow-intense-l" x="-50%" y="-50%" width="200%" height="200%">
  <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.25" result="shadow"></feDropShadow>
  <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b1"></feGaussianBlur>
  <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b2"></feGaussianBlur>
  <feMerge>
    <feMergeNode in="shadow"></feMergeNode>
    <feMergeNode in="b1"></feMergeNode>
    <feMergeNode in="b2"></feMergeNode>
    <feMergeNode in="SourceGraphic"></feMergeNode>
  </feMerge>
</filter><linearGradient id="bg-supreme-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2a2d3e"></stop><stop offset="100%" stop-color="#0a0a0f"></stop></linearGradient><linearGradient id="bg-supreme-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#cbd5e1"></stop></linearGradient><linearGradient id="bg-void-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a0033"></stop><stop offset="50%" stop-color="#05000a"></stop><stop offset="100%" stop-color="#000000"></stop></linearGradient><linearGradient id="bg-void-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#312e81"></stop><stop offset="50%" stop-color="#0f172a"></stop><stop offset="100%" stop-color="#020617"></stop></linearGradient><linearGradient id="bg-ice-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#002244"></stop><stop offset="100%" stop-color="#000a1a"></stop></linearGradient><linearGradient id="bg-ice-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e0f2fe"></stop><stop offset="100%" stop-color="#7dd3fc"></stop></linearGradient><linearGradient id="bg-gold-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4a3b1c"></stop><stop offset="100%" stop-color="#1a140a"></stop></linearGradient><linearGradient id="bg-gold-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fef3c7"></stop><stop offset="100%" stop-color="#fbbf24"></stop></linearGradient><linearGradient id="bg-moon-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#334155"></stop><stop offset="100%" stop-color="#0f172a"></stop></linearGradient><linearGradient id="bg-moon-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f8fafc"></stop><stop offset="100%" stop-color="#94a3b8"></stop></linearGradient><linearGradient id="bg-omega-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4a0000"></stop><stop offset="100%" stop-color="#1a0000"></stop></linearGradient><linearGradient id="bg-omega-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fee2e2"></stop><stop offset="100%" stop-color="#f87171"></stop></linearGradient><linearGradient id="bg-matrix-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#003311"></stop><stop offset="100%" stop-color="#001100"></stop></linearGradient><linearGradient id="bg-matrix-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#dcfce7"></stop><stop offset="100%" stop-color="#4ade80"></stop></linearGradient><linearGradient id="bg-platinum-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#475569"></stop><stop offset="100%" stop-color="#1e293b"></stop></linearGradient><linearGradient id="bg-platinum-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="100%" stop-color="#94a3b8"></stop></linearGradient><linearGradient id="bg-nebula-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#581c87"></stop><stop offset="50%" stop-color="#831843"></stop><stop offset="100%" stop-color="#171717"></stop></linearGradient><linearGradient id="bg-nebula-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f3e8ff"></stop><stop offset="50%" stop-color="#fbcfe8"></stop><stop offset="100%" stop-color="#cbd5e1"></stop></linearGradient><linearGradient id="bg-aegis-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"></stop><stop offset="100%" stop-color="#020617"></stop></linearGradient><linearGradient id="bg-aegis-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f1f5f9"></stop><stop offset="100%" stop-color="#94a3b8"></stop></linearGradient><linearGradient id="bg-reactor-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#14532d"></stop><stop offset="100%" stop-color="#052e16"></stop></linearGradient><linearGradient id="bg-reactor-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#dcfce7"></stop><stop offset="100%" stop-color="#4ade80"></stop></linearGradient><linearGradient id="bg-tactical-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#450a0a"></stop><stop offset="100%" stop-color="#2a0000"></stop></linearGradient><linearGradient id="bg-tactical-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fee2e2"></stop><stop offset="100%" stop-color="#f87171"></stop></linearGradient><linearGradient id="bg-arcane-d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3b0764"></stop><stop offset="100%" stop-color="#17002e"></stop></linearGradient><linearGradient id="bg-arcane-l" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f3e8ff"></stop><stop offset="100%" stop-color="#c084fc"></stop></linearGradient></defs><g stroke="#14b8a6" fill="none" filter="url(#glow-neon-l)" opacity="0.4" style="transform-origin:120px 120px"><g class="e-rot-box"><rect x="20" y="20" width="200" height="200" stroke-width="1" stroke-dasharray="10 10"></rect><rect x="40" y="40" width="160" height="160" stroke-width="1" stroke-dasharray="5 15"></rect></g><path d="M120 20v200M20 120h200" stroke-width="2"></path><line x1="20" y1="120" x2="220" y2="120" stroke="#14b8a6" stroke-width="4" class="e-scan-line" opacity="0.6"></line></g><g class="" filter="url(#glow-intense-l)"><circle cx="120" cy="120" r="65" fill="url(#bg-a-earth-l)" opacity="0.9" stroke="#22c55e" stroke-width="2"></circle><line key="l0" x1="150" y1="70" x2="120" y2="100" stroke="#22c55e" stroke-width="4" class="line-earth" opacity="0.8"></line><line key="l1" x1="120" y1="100" x2="90" y2="130" stroke="#22c55e" stroke-width="4" class="line-earth" opacity="0.8"></line><line key="l2" x1="90" y1="130" x2="130" y2="170" stroke="#22c55e" stroke-width="4" class="line-earth" opacity="0.8"></line><line key="l3" x1="120" y1="100" x2="160" y2="140" stroke="#22c55e" stroke-width="4" class="line-earth" opacity="0.8"></line><g key="n0"><circle cx="150" cy="70" r="8" fill="#14b8a6" class="node-earth" style="animation-delay:0s"></circle><circle cx="150" cy="70" r="3" fill="#fff"></circle></g><g key="n1"><circle cx="120" cy="100" r="8" fill="#14b8a6" class="node-earth" style="animation-delay:0.2s"></circle><circle cx="120" cy="100" r="3" fill="#fff"></circle></g><g key="n2"><circle cx="90" cy="130" r="8" fill="#14b8a6" class="node-earth" style="animation-delay:0.4s"></circle><circle cx="90" cy="130" r="3" fill="#fff"></circle></g><g key="n3"><circle cx="130" cy="170" r="10" fill="#14b8a6" class="node-earth" style="animation-delay:0.6000000000000001s"></circle><circle cx="130" cy="170" r="3" fill="#fff"></circle></g><g key="n4"><circle cx="160" cy="140" r="8" fill="#14b8a6" class="node-earth" style="animation-delay:0.8s"></circle><circle cx="160" cy="140" r="3" fill="#fff"></circle></g></g></svg>
